name: Release

on:
  push:
    branches: [ master ]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Compute next version
      id: version
      run: |
        latest=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
        if [ -z "$latest" ]; then
          echo "version=v0.1.0" >> $GITHUB_OUTPUT
        else
          major=$(echo $latest | cut -d. -f1 | tr -d 'v')
          minor=$(echo $latest | cut -d. -f2)
          patch=$(echo $latest | cut -d. -f3)
          echo "version=v${major}.${minor}.$((patch + 1))" >> $GITHUB_OUTPUT
        fi

    - name: Create tag
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git tag ${{ steps.version.outputs.version }}
        git push origin ${{ steps.version.outputs.version }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build binaries
      run: |
        GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${{ steps.version.outputs.version }}" -o brezno-linux-amd64 ./cmd/brezno
        GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=${{ steps.version.outputs.version }}" -o brezno-linux-arm64 ./cmd/brezno

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create ${{ steps.version.outputs.version }} \
          brezno-linux-amd64 \
          brezno-linux-arm64 \
          --title "brezno ${{ steps.version.outputs.version }}" \
          --generate-notes
